[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-ingestion"
version = "0.1.0"
description = "RAG Ingestion Pipeline with MongoDB and Jina Embeddings"
authors = [{name = "Your Name", email = "your.email@example.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymongo>=4.6",
    "requests>=2.31",
    "celery>=5.3",
    "redis>=5.0",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "typer>=0.9",
    "pydantic>=2.0",
    "click>=8.0",  # For Celery
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
    "mypy>=1.5",
]

[project.scripts]
rag-ingest = "cli.ingest:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli", "core", "handlers", "workers", "config"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true